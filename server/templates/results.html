{% extends "base.html" %}
{% set active_page = "results" %}
{% block title %}采集结果 - Amazon Scraper v4{% endblock %}

{% block content %}
<h2 class="page-title">采集结果</h2>
<p class="page-subtitle">浏览和搜索采集数据</p>

<!-- 筛选栏 -->
<div class="card mb-4">
    <div class="card-body">
        <div class="row g-2 align-items-end">
            <div class="col-md-3">
                <label class="form-label">批次筛选</label>
                <select id="batchFilter" class="form-select">
                    <option value="">全部批次</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label">变动筛选</label>
                <select id="changeFilter" class="form-select">
                    <option value="all">全部 ASIN</option>
                    <option value="price_stock">价格/库存变动</option>
                    <option value="title_bullets">标题/五点描述变动</option>
                    <option value="new">新增 ASIN</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">搜索（支持批量，换行或逗号分隔）</label>
                <textarea id="searchInput" class="form-control" rows="1" placeholder="ASIN / 标题 / 品牌，多个用换行或逗号分隔"
                          style="resize:vertical; min-height:38px;"></textarea>
            </div>
            <div class="col-md-1">
                <label class="form-label">&nbsp;</label>
                <button class="btn btn-accent w-100" onclick="loadResults()"><i class="bi bi-search"></i></button>
            </div>
            <div class="col-md-3 text-end">
                <label class="form-label">&nbsp;</label>
                <div class="d-flex justify-content-end gap-1">
                    <button class="btn btn-outline-accent btn-sm" onclick="openExportModal()">
                        <i class="bi bi-download"></i> 导出
                    </button>
                    <button class="btn btn-outline-danger btn-sm" id="deleteSelectedBtn" onclick="deleteSelected()" style="display:none;">
                        <i class="bi bi-trash3"></i> 删除选中 (<span id="selectedCount">0</span>)
                    </button>
                    <button class="btn btn-outline-warning btn-sm" onclick="document.getElementById('deleteFileInput').click()">
                        <i class="bi bi-upload"></i> 上传删除
                    </button>
                    <input type="file" id="deleteFileInput" accept=".xlsx,.csv,.txt" style="display:none;" onchange="deleteByFile(this)">
                    <button class="btn btn-outline-danger btn-sm" onclick="clearData()">
                        <i class="bi bi-trash3"></i> 清空数据
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 结果列表 -->
<div class="alert alert-warning py-2 mb-3" id="filterNotice" style="display:none;"></div>
<div class="card">
    <div class="card-header d-flex justify-content-between">
        <span><i class="bi bi-table"></i> 共 <span id="resultTotal">-</span> 条结果</span>
        <span class="text-secondary" id="pageInfo"></span>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th style="width:30px;"><input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)"></th>
                        <th>ASIN</th>
                        <th>标题</th>
                        <th>评分</th>
                        <th>评论数</th>
                        <th>当前价格</th>
                        <th>BuyBox</th>
                        <th>品牌</th>
                        <th>卖家店铺</th>
                        <th>库存</th>
                        <th>FBA</th>
                        <th>配送</th>
                        <th>采集时间</th>
                        <th>截图</th>
                    </tr>
                </thead>
                <tbody id="resultBody">
                    <tr><td colspan="11" class="text-center text-secondary p-4">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="card-footer d-flex justify-content-between align-items-center">
        <button class="btn btn-outline-secondary btn-sm" id="prevBtn" onclick="loadPrev()" disabled>
            <i class="bi bi-chevron-left"></i> 上一页
        </button>
        <span id="pageCounter" class="text-secondary"></span>
        <button class="btn btn-outline-secondary btn-sm" id="nextBtn" onclick="loadNext()" disabled>
            下一页 <i class="bi bi-chevron-right"></i>
        </button>
    </div>
</div>

<!-- 截图预览 Modal -->
<div class="modal fade" id="screenshotModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">截图预览</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center">
                <img id="screenshotImg" src="" style="max-width:100%; border:1px solid var(--border);">
            </div>
        </div>
    </div>
</div>
<!-- 导出 Modal -->
<div class="modal fade" id="exportModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-download"></i> 导出数据</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label class="form-label">导出格式</label>
                        <select id="exportFormat" class="form-select" onchange="onExportFormatChange()">
                            <option value="xlsx">Excel (.xlsx)</option>
                            <option value="csv">CSV (.csv)</option>
                        </select>
                    </div>
                    <div class="col-md-8">
                        <label class="form-label">导出范围</label>
                        <div class="form-control-plaintext" id="exportScope" style="color:var(--text-secondary);">全部数据</div>
                    </div>
                </div>
                <div id="fieldSelectionArea">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <label class="form-label mb-0">选择导出字段</label>
                        <div class="btn-group btn-group-sm">
                            <button class="btn btn-outline-accent" onclick="selectAllFields()">全选</button>
                            <button class="btn btn-outline-secondary" onclick="selectNoFields()">全不选</button>
                            <button class="btn btn-outline-warning" onclick="selectPriceStockOnly()">仅价格库存</button>
                        </div>
                    </div>
                    <div id="exportFields" style="max-height:300px; overflow-y:auto; columns:3; gap:8px;"></div>
                </div>
                <div class="mt-3 text-end">
                    <button class="btn btn-accent" onclick="doExport()"><i class="bi bi-download"></i> 开始导出</button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const esc = s => {
    if (s == null) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
};

// 状态
let state = {
    batchId: null,
    search: '',
    changeFilter: 'all',
    nextCursor: null,
    prevCursor: null,
    cursorStack: [],
    currentStartCursor: null,
    // 首屏那次拿到的 total。翻页时服务端不再回 total（with_total=false），
    // 沿用这个值 —— 它在整个翻页过程中本来就恒定不变。
    total: null,
    // total 是不是估算值（决定显示"约 N"还是"N"）。与 total 同一时刻更新，
    // 因为它描述的就是 total 那一个数 —— 分开更新迟早会出现"数换了、前缀还是
    // 上一次那个"。
    totalIsEstimate: false,
};

const CHANGE_FILTERS = ['all', 'price_stock', 'title_bullets', 'new'];

// URL <-> 筛选状态。
//
// ⚠ 这一段以前**整个不存在**：state.batchId 初始化成 null 之后就只被下拉框改过，
// 谁也不读 location.search。于是任务页和仪表盘上那三处
// `<a href="/results?batch_id=...">` 点进来，打开的是一个**没有筛选**的
// 结果页 —— 链接看起来好好的，行为上等于死链。
function readFiltersFromUrl() {
    const q = new URLSearchParams(location.search);
    const bid = q.get('batch_id');
    // 只认纯数字：后面要用它和 <option value> 做 == 比较，也要拼进 API 查询串
    if (bid && /^\d+$/.test(bid)) state.batchId = bid;
    const cf = q.get('change_filter');
    if (cf && CHANGE_FILTERS.includes(cf)) state.changeFilter = cf;
    const sq = q.get('search');
    if (sq) state.search = normalizeSearch(sq);
}

// 把当前筛选写回地址栏（replaceState：不往历史里塞条目，刷新/收藏/分享都能复现）
function syncUrl() {
    const q = new URLSearchParams();
    if (state.batchId) q.set('batch_id', state.batchId);
    if (state.changeFilter && state.changeFilter !== 'all') q.set('change_filter', state.changeFilter);
    if (state.search) q.set('search', state.search);
    const qs = q.toString();
    history.replaceState(null, '', qs ? `${location.pathname}?${qs}` : location.pathname);
}

// 搜索框的归一化：换行或逗号分隔 -> 逗号分隔的单行。
// **唯一真源** —— URL 快照、state.search、发给 API 的值必须是同一个字符串，
// 否则地址栏里的和实际搜的对不上（历史上就是这么不一致的）。
function normalizeSearch(raw) {
    return String(raw || '').split(/[\n,]+/).map(t => t.trim()).filter(Boolean).join(',');
}

function resetPaging() {
    state.nextCursor = null;
    state.prevCursor = null;
    state.cursorStack = [];
    state.currentStartCursor = null;
}

// 初始化
document.addEventListener('DOMContentLoaded', async () => {
    readFiltersFromUrl();
    document.getElementById('changeFilter').value = state.changeFilter;
    document.getElementById('searchInput').value = state.search;

    // ⚠ 必须**先 await** loadBatches()：它会重建整个 <select> 的 <option>，
    // 在那之前给 sel.value 赋值会被静默丢弃（没有匹配的 option -> value 变空串）。
    await loadBatches();
    const sel = document.getElementById('batchFilter');
    if (state.batchId) {
        sel.value = state.batchId;
        if (sel.value !== state.batchId) {
            // 批次已被删除 / id 不存在：退回全部批次，并说明为什么，
            // 而不是让用户对着一个"看起来没筛选"的页面猜。
            logInvalidBatch(state.batchId);
            state.batchId = null;
            sel.value = '';
        }
    }
    syncUrl();

    loadResults();

    document.getElementById('batchFilter').addEventListener('change', () => {
        state.batchId = document.getElementById('batchFilter').value || null;
        resetPaging();
        clearFilterNotice();
        syncUrl();
        loadResults();
    });

    document.getElementById('changeFilter').addEventListener('change', () => {
        state.changeFilter = document.getElementById('changeFilter').value;
        resetPaging();
        clearFilterNotice();
        syncUrl();
        loadResults();
    });

    // ⚠ #searchInput 是 <textarea>（要支持"换行或逗号分隔"的批量粘贴），
    // 所以回车会先把 '\n' 插进 value，keyup 才触发。原来直接把 e.target.value
    // 快照进 URL，于是地址栏变成 ?search=GoldenBrand%0A，而且**每按一次回车
    // 累积一个** —— 分享出去的链接里搜索框带着一串空行，看着像坏了。
    // 而发给 API 的值又是在 loadResults 里重新 trim/split 归一化过的，
    // 两者不一致。这里在 keydown 阶段就拦掉回车（不让它插换行），并统一走
    // 同一份归一化。Shift+Enter 保留换行，批量粘贴照常能用。
    const searchEl = document.getElementById('searchInput');
    searchEl.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) e.preventDefault();
    });
    searchEl.addEventListener('keyup', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
            state.search = normalizeSearch(e.target.value);
            e.target.value = state.search;
            resetPaging();
            clearFilterNotice();
            syncUrl();
            loadResults();
        }
    });
});

// ⚠ 提示**不能**写进 #resultBody：紧接着的 loadResults() 一返回，
// renderResults() 就会 `tbody.innerHTML = html` 把整块覆盖掉 —— 实测这句话
// 只活了 26ms。用户看到的仍然是「一个看起来没筛选的页面」，正是这段代码
// 想避免的情况。所以写进表格外面那个独立横幅。
function logInvalidBatch(id) {
    const el = document.getElementById('filterNotice');
    if (el) {
        el.textContent = `批次 ${String(id)} 不存在（可能已被删除），已显示全部批次`;
        el.style.display = '';
    }
}

// 用户自己改筛选时把横幅收掉 —— 它说的是"你点进来的那个链接失效了"，
// 一旦用户主动选了别的条件，这句话就不再成立。
function clearFilterNotice() {
    const el = document.getElementById('filterNotice');
    if (el) el.style.display = 'none';
}

async function loadBatches() {
    try {
        const resp = await fetch('/api/batches');
        const data = await resp.json();
        const sel = document.getElementById('batchFilter');
        const current = sel.value;
        sel.innerHTML = '<option value="">全部批次</option>';
        for (const b of data.batches) {
            sel.innerHTML += `<option value="${b.id}" ${current == b.id ? 'selected' : ''}>${esc(b.name)} (${b.completed||0}/${b.total_tasks||0})</option>`;
        }
    } catch(e) {}
}

async function loadResults(cursor = null, direction = 'next') {
    // 批量搜索：换行/逗号分隔 → 逗号连接
    const rawSearch = document.getElementById('searchInput').value.trim();
    state.search = rawSearch.split(/[\n,]+/).map(s => s.trim()).filter(s => s).join(',');
    state.changeFilter = document.getElementById('changeFilter').value;

    // 只要这张表真正渲染的列。默认的 SELECT d.* 是 56 列，其中
    // bullet_points / image_urls / long_description 这三个大块头这张表一个都
    // 不显示 —— 实测 100 万行的库上单页 274 KB -> 17.8 KB。
    // 加列的时候记得同步这里，漏了就是那一列渲染成 undefined。
    // （服务端还会强制补 id / asin / screenshot_path / updated_at，不用写。）
    const UI_FIELDS = [
        'asin', 'title', 'brand', 'current_price', 'buybox_price',
        'rating', 'review_count', 'seller_id', 'seller_name',
        'stock_count', 'stock_status', 'is_fba', 'delivery_date',
        'crawl_time', 'screenshot_path'
    ].join(',');

    // total 是全表 COUNT，随行数线性增长，而翻页途中它恒定不变 ——
    // 只在首屏要一次。cursor 非空 = 在翻页，直接省掉。
    const needTotal = !cursor;

    // sort=recent = 「最近采的排前面」。服务端默认是 sort=id（首次入库倒序），
    // 那个默认不能动 —— 游标语义是对外契约，改默认会让老调用方拿着同一个游标
    // 翻出语义完全不同的一页。所以由前端显式要。
    let url = `/api/results?limit=50&change_filter=${state.changeFilter}&direction=${direction}`
            + `&fields=${UI_FIELDS}&sort=recent`;
    if (!needTotal) url += '&with_total=false';
    if (state.batchId) url += `&batch_id=${state.batchId}`;
    if (state.search) url += `&search=${encodeURIComponent(state.search)}`;
    if (cursor) url += `&cursor=${cursor}`;

    try {
        const resp = await fetch(url);
        if (!resp.ok) {
            const err = await resp.clone().json().catch(() => ({}));
            // 游标那一行被删了（多半就是刚在这个页面上删的）。静默退回第一页，
            // 别把一个 422 甩给用户 —— 他要的只是"接着看"。
            if (err?.detail?.error === 'cursor_expired' && cursor) {
                resetPaging();
                return loadResults();
            }
            document.getElementById('resultBody').innerHTML =
                `<tr><td colspan="14" class="text-center text-danger p-4">加载失败: ${esc(await window.apiErrText(resp))}</td></tr>`;
            return;
        }
        const data = await resp.json();

        // 翻页时服务端不再回 total（null）——沿用首屏那次的值，别把计数刷成空
        if (data.total !== null && data.total !== undefined) {
            state.total = data.total;
            // 无筛选的大库上服务端给的是 pg_class.reltuples 估算值（省掉一次
            // 全表 COUNT，百万行上是 683ms -> 0）。误差通常 < 1%，但**必须
            // 让人看出来**：不标记的话，用户会拿这个数去跟导出的行数对账，
            // 差几十条时以为是丢数据了。带筛选时服务端仍然精确，标记为 false。
            state.totalIsEstimate = data.total_is_estimate === true;
        }
        document.getElementById('resultTotal').textContent =
            state.total === null || state.total === undefined
                ? '-'
                : (state.totalIsEstimate ? '约 ' : '') + state.total;

        state.nextCursor = data.next_cursor;
        state.prevCursor = data.prev_cursor;

        document.getElementById('nextBtn').disabled = !data.has_more;
        document.getElementById('prevBtn').disabled = state.cursorStack.length === 0;

        renderResults(data.items);
    } catch(e) {
        document.getElementById('resultBody').innerHTML = `<tr><td colspan="11" class="text-center text-danger p-4">加载失败: ${esc(e.message)}</td></tr>`;
    }
}

function loadNext() {
    if (state.nextCursor) {
        // 记录当前页的起始 cursor，用于回退
        state.cursorStack.push(state.currentStartCursor);
        state.currentStartCursor = state.nextCursor;
        loadResults(state.nextCursor, 'next');
    }
}

function loadPrev() {
    if (state.cursorStack.length > 0) {
        const prevStart = state.cursorStack.pop();
        state.currentStartCursor = prevStart;
        if (prevStart) {
            loadResults(prevStart, 'next');
        } else {
            // 回到第一页
            loadResults(null, 'next');
        }
    }
}

function renderResults(items) {
    const tbody = document.getElementById('resultBody');
    if (!items || items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="14" class="text-center text-secondary p-4">暂无数据</td></tr>';
        updateSelectUI();
        return;
    }

    let html = '';
    for (const r of items) {
        const asin = esc(r.asin);
        const title = esc((r.title || '').substring(0, 60));
        const price = esc(r.current_price || 'N/A');
        const buybox = esc(r.buybox_price || 'N/A');
        const brand = esc(r.brand || 'N/A');
        const rating = esc(r.rating || 'N/A');
        const reviewCount = esc(r.review_count || 'N/A');
        const sellerName = esc(r.seller_name || 'N/A');
        const sellerId = esc(r.seller_id || '');
        const stock = esc(r.stock_count || '0');
        const stockStatus = esc(r.stock_status || '');
        const fba = esc(r.is_fba || 'N/A');
        const delivery = esc(r.delivery_date || 'N/A');
        const crawlTime = esc(r.crawl_time || '');
        const hasScreenshot = r.screenshot_path && r.screenshot_path.startsWith('/static/');

        const fbaCell = fba === 'FBA'
            ? '<span class="badge-status badge-done">FBA</span>'
            : fba === 'FBM'
                ? '<span class="badge-status badge-pending">FBM</span>'
                : esc(fba);

        // 卖家：显示店名，hover 显示 ID；Amazon 自营特殊标记
        const sellerCell = (sellerId && sellerId !== 'N/A')
            ? (sellerId === 'AMAZON'
                ? '<span class="badge-status badge-done">Amazon</span>'
                : `<span title="${sellerId}">${sellerName}</span>`)
            : (sellerName !== 'N/A' ? sellerName : '-');

        html += `<tr>
            <td><input type="checkbox" class="row-check" value="${asin}" onchange="updateSelectUI()"></td>
            <td><a href="https://www.amazon.com/dp/${asin}" target="_blank" class="text-accent">${asin}</a></td>
            <td title="${esc(r.title || '')}">${title}</td>
            <td>${rating !== 'N/A' ? `<span title="${rating} / 5">${rating} ★</span>` : '-'}</td>
            <td>${reviewCount}</td>
            <td>${price}</td>
            <td>${buybox}</td>
            <td>${brand}</td>
            <td>${sellerCell}</td>
            <td>${stock}</td>
            <td>${fbaCell}</td>
            <td>${delivery}</td>
            <td style="font-size:0.8rem">${crawlTime}</td>
            <td>${hasScreenshot ? `<button class="btn btn-outline-secondary btn-sm" onclick="showScreenshot('${esc(r.screenshot_path)}')"><i class="bi bi-image"></i></button>` : '-'}</td>
        </tr>`;
    }
    tbody.innerHTML = html;
    updateSelectUI();
}

function toggleSelectAll(master) {
    document.querySelectorAll('.row-check').forEach(cb => cb.checked = master.checked);
    updateSelectUI();
}

function updateSelectUI() {
    const checked = document.querySelectorAll('.row-check:checked');
    const btn = document.getElementById('deleteSelectedBtn');
    const count = document.getElementById('selectedCount');
    if (checked.length > 0) {
        btn.style.display = '';
        count.textContent = checked.length;
    } else {
        btn.style.display = 'none';
    }
    // 同步全选框状态
    const all = document.querySelectorAll('.row-check');
    const selectAll = document.getElementById('selectAll');
    if (selectAll) selectAll.checked = all.length > 0 && checked.length === all.length;
}

async function deleteSelected() {
    const checked = [...document.querySelectorAll('.row-check:checked')];
    if (!checked.length) return;
    const asins = checked.map(cb => cb.value);
    if (!confirm(`确定删除选中的 ${asins.length} 条数据？此操作不可恢复！`)) return;
    try {
        const body = { asins };
        if (state.batchId) body.batch_id = parseInt(state.batchId);
        const resp = await fetch('/api/results', {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
        });
        if (!resp.ok) {
            alert('删除失败: ' + await window.apiErrText(resp));
            return;
        }
        loadResults();
    } catch(e) {
        alert('网络错误: ' + e.message);
    }
}

function showScreenshot(path) {
    // path 是 /api/results 的 JSON 里给的 `/static/screenshots/...`。
    // **必须过 window.staticUrl()**（定义在 base.html）：本服务部署在子路径下
    // 时，JSON 里的路径不会被反代的 sub_filter 改写，直接用会请求到
    // `/static/...` —— 那个地址返回 200 + text/html 而不是 404，<img> 静默
    // 失败、控制台无报错，看起来就像"截图根本没保存"。
    document.getElementById('screenshotImg').src = window.staticUrl(path);
    new bootstrap.Modal(document.getElementById('screenshotModal')).show();
}

// ==================== 导出功能 ====================
let _exportFields = [];
let _exportHeaders = {};

async function openExportModal() {
    // 加载字段列表
    if (!_exportFields.length) {
        try {
            const resp = await fetch('/api/export/fields');
            const data = await resp.json();
            _exportFields = data.fields;
            _exportHeaders = data.headers;
        } catch(e) { return; }
    }

    // 显示导出范围
    const batchSel = document.getElementById('batchFilter');
    const batchText = batchSel.options[batchSel.selectedIndex]?.text || '全部';
    const filterSel = document.getElementById('changeFilter');
    const filterText = filterSel.options[filterSel.selectedIndex]?.text || '全部';
    document.getElementById('exportScope').textContent = `${batchText} / ${filterText}`;

    // 渲染字段复选框
    const saved = JSON.parse(localStorage.getItem('export_fields') || 'null');
    const container = document.getElementById('exportFields');
    container.innerHTML = '';
    for (const f of _exportFields) {
        const checked = saved ? saved.includes(f) : true;
        const label = esc(_exportHeaders[f] || f);
        container.innerHTML += `<div style="break-inside:avoid; margin-bottom:4px;">
            <label><input type="checkbox" value="${f}" ${checked ? 'checked' : ''}> ${label}</label>
        </div>`;
    }

    new bootstrap.Modal(document.getElementById('exportModal')).show();
}

function onExportFormatChange() {
    // db 格式不支持字段选择（v3 暂不实现 .db 导出）
}

function selectAllFields() {
    document.querySelectorAll('#exportFields input').forEach(cb => cb.checked = true);
}
function selectNoFields() {
    document.querySelectorAll('#exportFields input').forEach(cb => cb.checked = false);
}
function selectPriceStockOnly() {
    const keep = new Set(['asin','title','current_price','buybox_price','buybox_shipping',
        'stock_count','stock_status','is_fba','delivery_date','total_price','crawl_time','updated_at']);
    document.querySelectorAll('#exportFields input').forEach(cb => {
        cb.checked = keep.has(cb.value);
    });
}

async function doExport() {
    const format = document.getElementById('exportFormat').value;
    const selected = [...document.querySelectorAll('#exportFields input:checked')].map(cb => cb.value);
    if (!selected.length) { alert('请至少选择一个字段'); return; }

    // 持久化
    localStorage.setItem('export_fields', JSON.stringify(selected));

    // 构建 URL
    let url;
    if (state.batchId) {
        const resp = await fetch('/api/batches');
        const data = await resp.json();
        const batch = data.batches.find(b => b.id == state.batchId);
        url = batch ? `/api/export/${encodeURIComponent(batch.name)}` : '/api/export/all';
    } else {
        url = '/api/export/all';
    }

    url += `?format=${format}&change_filter=${state.changeFilter}&fields=${selected.join(',')}`;
    bootstrap.Modal.getInstance(document.getElementById('exportModal'))?.hide();
    window.open(url, '_blank');
}

async function clearData() {
    const hasBatch = !!state.batchId;
    const hasSearch = !!state.search;
    const hasFilter = hasBatch || hasSearch;

    let msg, body;
    if (hasBatch && hasSearch) {
        const batchSel = document.getElementById('batchFilter');
        const batchText = batchSel.options[batchSel.selectedIndex]?.text || '';
        msg = `确定删除批次「${batchText}」中搜索匹配的数据？此操作不可恢复！`;
        body = { batch_id: parseInt(state.batchId), search: state.search };
    } else if (hasBatch) {
        const batchSel = document.getElementById('batchFilter');
        const batchText = batchSel.options[batchSel.selectedIndex]?.text || '';
        msg = `确定删除批次「${batchText}」的全部数据？此操作不可恢复！`;
        body = { batch_id: parseInt(state.batchId) };
    } else if (hasSearch) {
        msg = `确定删除搜索匹配「${state.search}」的全部数据？此操作不可恢复！`;
        body = { search: state.search };
    } else {
        msg = '未选择任何筛选条件，将清空全部采集数据和截图！确定继续？';
        body = null;
    }

    if (!confirm(msg)) return;

    try {
        let resp;
        if (body) {
            resp = await fetch('/api/results', {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });
        } else {
            resp = await fetch('/api/database', { method: 'DELETE' });
        }
        if (!resp.ok) {
            alert('删除失败: ' + await window.apiErrText(resp));
            return;
        }
        const data = await resp.json();
        {
            const deleted = data.deleted != null ? `已删除 ${data.deleted} 条` : '数据已清空';
            alert(deleted);
            loadResults();
            loadBatches();
        }
    } catch(e) {
        alert('网络错误: ' + e.message);
    }
}

async function deleteByFile(input) {
    if (!input.files.length) return;
    const fd = new FormData();
    fd.append('file', input.files[0]);
    input.value = '';  // 重置，允许重复上传同一文件
    try {
        const resp = await fetch('/api/results/delete-by-file', { method: 'POST', body: fd });
        if (!resp.ok) {
            alert('删除失败: ' + await window.apiErrText(resp));
            return;
        }
        const data = await resp.json();
        alert(`已删除 ${data.deleted} 条数据（文件中识别到 ${data.asin_count} 个 ASIN）`);
        loadResults();
        loadBatches();
    } catch(e) {
        alert('网络错误: ' + e.message);
    }
}
